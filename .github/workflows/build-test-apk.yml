name: Build test APK (shared signature)

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'open-api/**'
      - 'i18n/**'
      - 'keystores/**'
  workflow_dispatch:

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          working-directory: mobile

      - name: Install dependencies
        run: mise run install:ci

      - name: Generate code (openapi, pigeon, i18n, drift)
        run: mise run codegen

      - name: Generate shared test keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/android/key.jks" \
            -storetype PKCS12 \
            -alias familytest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass familystore -keypass familystore \
            -dname "CN=Family Suite Test Key, OU=Family Suite, O=Family Suite, C=FR"

      - name: Build release APK signed with the shared test key
        working-directory: ./mobile
        run: flutter build apk --release
        env:
          ALIAS: familytest
          ANDROID_KEY_PASSWORD: familystore
          ANDROID_STORE_PASSWORD: familystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-test-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
